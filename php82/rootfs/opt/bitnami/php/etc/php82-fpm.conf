[global]
error_log = /proc/self/fd/2
log_level = warning
daemonize = yes
pid = /opt/bitnami/php/var/run/php82-fpm.pid

[php82]
user = daemon
group = daemon
listen = /opt/bitnami/php/var/run/php82.sock
listen.owner = daemon
listen.group = daemon
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
catch_workers_output = yes
clear_env = no
request_slowlog_timeout = 0
