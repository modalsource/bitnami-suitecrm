name: Build & publish image (GHCR)

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Tag aggiuntivo opzionale (es. 7.14.2-php8.2.35-sec2026)'
        required: false
        default: ''
      push_latest:
        description: 'Taggare anche latest?'
        type: boolean
        required: false
        default: true
      platforms:
        description: 'Piattaforme (build amd64 nativa su runner ubuntu)'
        required: false
        default: 'linux/amd64'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: modalsource/bitnami-suitecrm

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: php82
          file: php82/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "### Immagine pubblicata su GHCR"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
